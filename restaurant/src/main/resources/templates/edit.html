<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit Restaurant</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>

        body{
            font-family:'Segoe UI', sans-serif;
            margin:0;
            height:100vh;
            background:linear-gradient(135deg,#3a7bd5,#3a6073);
            display:flex;
            justify-content:center;
            align-items:center;
        }

        /* CARD */

        .container{
            background:white;
            padding:35px;
            width:380px;
            border-radius:12px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        /* INPUT GROUP */

        .input-group{
            position:relative;
            margin-bottom:15px;
        }

        .input-group i{
            position:absolute;
            top:12px;
            left:12px;
            color:#888;
        }

        input{
            width:100%;
            padding:10px 10px 10px 35px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:14px;
        }

        input:focus{
            border-color:#3a7bd5;
            outline:none;
        }

        /* BUTTON */

        button{
            width:100%;
            padding:12px;
            border:none;
            background:#3a7bd5;
            color:white;
            font-size:15px;
            border-radius:6px;
            cursor:pointer;
            margin-top:10px;
            transition:0.3s;
        }

        button:hover{
            background:#2c5fc7;
        }

        /* BACK LINK */

        .back{
            display:block;
            text-align:center;
            margin-top:15px;
            text-decoration:none;
            color:#3a7bd5;
            font-weight:bold;
        }

        .back:hover{
            text-decoration:underline;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>✏ Edit Restaurant</h2>

    <form th:action="@{/save}" th:object="${restaurant}" method="post">

        <div class="input-group">
            <i class="fa fa-id-badge"></i>
            <input type="text" th:field="*{id}" readonly>
        </div>

        <div class="input-group">
            <i class="fa fa-store"></i>
            <input type="text" th:field="*{name}" placeholder="Restaurant Name">
        </div>

        <div class="input-group">
            <i class="fa fa-location-dot"></i>
            <input type="text" th:field="*{location}" placeholder="Location">
        </div>

        <div class="input-group">
            <i class="fa fa-star"></i>
            <input type="text" th:field="*{rating}" placeholder="Rating">
        </div>

        <div class="input-group">
            <i class="fa fa-utensils"></i>
            <input type="text" th:field="*{cuising}" placeholder="Cuisine">
        </div>

        <button type="submit">
            <i class="fa fa-save"></i> Update Restaurant
        </button>

    </form>

    <a th:href="@{/}" class="back">
        <i class="fa fa-arrow-left"></i> Back to List
    </a>

</div>

</body>
</html>
