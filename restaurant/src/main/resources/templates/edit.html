<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <title>Edit Restaurant</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color:#f4f6f9;
            margin:0;
            padding:0;
        }

        h2{
            text-align:center;
            margin-top:40px;
            color:#333;
        }

        form{
            width:350px;
            margin:30px auto;
            padding:25px;
            background:white;
            border-radius:8px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        input{
            width:100%;
            padding:10px;
            margin:8px 0;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:14px;
        }

        input:focus{
            border-color:#2c7be5;
            outline:none;
        }

        button{
            width:100%;
            padding:10px;
            background-color:#2c7be5;
            color:white;
            border:none;
            border-radius:5px;
            font-size:15px;
            cursor:pointer;
            margin-top:10px;
        }

        button:hover{
            background-color:#1a5dc9;
        }

        a{
            display:block;
            text-align:center;
            margin-top:15px;
            text-decoration:none;
            color:#2c7be5;
            font-weight:bold;
        }

        a:hover{
            text-decoration:underline;
        }
    </style>

</head>

<body>

<h2>Edit Restaurant</h2>

<form th:action="@{/save}" th:object="${restaurant}" method="post">

    <input type="text" th:field="*{id}" readonly placeholder="ID"/>
    <input type="text" th:field="*{name}" placeholder="Restaurant Name"/>
    <input type="text" th:field="*{location}" placeholder="Location"/>
    <input type="text" th:field="*{rating}" placeholder="Rating"/>
    <input type="text" th:field="*{cuising}" placeholder="Cuisine"/>

    <button type="submit">Update Restaurant</button>

</form>

<a th:href="@{/}">⬅ Back to List</a>

</body>
</html>
