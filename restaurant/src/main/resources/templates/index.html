<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Restaurant List</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f9;
            margin:0;
            padding:0;
        }

        h2{
            text-align:center;
            margin-top:30px;
            color:#333;
        }

        table{
            width:80%;
            margin:30px auto;
            border-collapse:collapse;
            background:white;
            box-shadow:0 4px 8px rgba(0,0,0,0.1);
        }

        th, td{
            padding:12px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        th{
            background-color:#2c7be5;
            color:white;
        }

        tr:hover{
            background-color:#f1f1f1;
        }

        a{
            text-decoration:none;
            padding:6px 12px;
            border-radius:5px;
            font-size:14px;
        }

        a:first-child{
            background-color:#28a745;
            color:white;
        }

        a:last-child{
            background-color:#dc3545;
            color:white;
        }

        a:hover{
            opacity:0.8;
        }
    </style>

</head>

<body>

<h2>Restaurant List</h2>

<table>
    <tr>
        <th>ID</th>
        <th>NAME</th>
        <th>LOCATION</th>
        <th>RATING</th>
        <th>CUISINE</th>
        <th>ACTION</th>
    </tr>

    <tr th:each="restaurant : ${restaurants}">
        <td th:text="${restaurant.id}"></td>
        <td th:text="${restaurant.name}"></td>
        <td th:text="${restaurant.location}"></td>
        <td th:text="${restaurant.rating}"></td>
        <td th:text="${restaurant.cuising}"></td>
        <td>
            <a th:href="@{'/edit/' + ${restaurant.id}}">Edit</a>
            <a th:href="@{'/delete/' + ${restaurant.id}}">Delete</a>
        </td>
    </tr>
</table>

</body>
</html>
